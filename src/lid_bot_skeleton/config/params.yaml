skeleton_node:
  ros__parameters:
    message: "Hello from lid_bot_skeleton."

serial_bridge:
  ros__parameters:
    port: "/dev/ttyUSB0"       # ESP32 USB port
    baud: 115200               # must match Serial.begin() in the firmware
    wheel_separation: 0.13     # meters between wheel centers (measure the car)
    max_wheel_speed: 0.5       # m/s that maps to full PWM (255)
    cmd_timeout: 0.5           # seconds without /cmd_vel before stopping
    send_rate: 20.0            # Hz, keeps the ESP32 watchdog fed

rplidar_node:
  ros__parameters:
    serial_port: "/dev/ttyUSB1"
    serial_baudrate: 115200    # A1/A2M8 = 115200, A2M12/A3 = 256000
    frame_id: "laser"
    angle_compensate: true
